name: Warby Parker
description: 'Warby Parker (NYSE: WRBY) is a direct-to-consumer eyewear and vision
  care company founded in 2010, selling prescription eyeglasses, sunglasses, contact
  lenses, and eye exams online and across 900+ retail stores. It operates a headless,
  modular commerce architecture and a proprietary point-of-sale system (Point of
  Everything), plus consumer-facing tools like Virtual Vision Test and PD measurement.
  Warby Parker does not publish a public developer API or developer portal; its API
  surface (api.warbyparker.com) is internal. The company does publish a public
  llms.txt for AI agents and an RFC 9116 security.txt with a bug-bounty contact. This
  API Evangelist profile captures that agent-facing and security posture; there is
  no OpenAPI/AsyncAPI or SDK surface to harvest.'
